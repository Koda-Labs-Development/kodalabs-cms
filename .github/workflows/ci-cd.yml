name: Deploy KodaLabs CMS to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit hash
        id: get_commit
        run: echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-and-push-image:
    needs: commit-hash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t ghcr.io/maxh33/kodalabs-cms:prod -f deployment/docker/Dockerfile .
          docker push ghcr.io/maxh33/kodalabs-cms:prod

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: 22
          source: "deployment/docker/docker-compose.prod.yml"
          target: "~/kodalabs-cms"
          strip_components: 2

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: 22
          script: |
            cd ~/kodalabs-cms

            # Create .env file with all secrets
            cat > .env << EOF
            # Server Configuration
            PORT=3001
            NODE_ENV=production
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            PAYLOAD_PUBLIC_SERVER_URL=https://cms.kodalabs.dev
            PAYLOAD_CONFIG_PATH=dist/payload.config.js
            CI=true
            PAYLOAD_DROP_DATABASE=false

            # Database Configuration
            POSTGRES_DB=kodalabs_cms
            POSTGRES_USER=kodalabs_cms
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=postgresql://kodalabs_cms:${{ secrets.POSTGRES_PASSWORD }}@cms-postgres:5432/kodalabs_cms

            # CORS Origins
            CORS_ORIGIN_PJ_CLT=${{ secrets.CORS_ORIGIN_PJ_CLT }}
            CORS_ORIGIN_KODALABS=${{ secrets.CORS_ORIGIN_KODALABS }}

            # Email Configuration (Optional)
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}

            # AI Content Generation (Optional)
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            AI_CONTENT_API_KEY=${{ secrets.AI_CONTENT_API_KEY }}

            # Webhooks (Optional)
            WEBHOOK_PJ_CLT=${{ secrets.WEBHOOK_PJ_CLT }}
            WEBHOOK_KODALABS=${{ secrets.WEBHOOK_KODALABS }}

            # Monitoring (Optional)
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

            # GitHub Container Registry (for Watchtower)
            GITHUB_USER=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.GHCR_TOKEN }}
            EOF

            # Create backup directory
            mkdir -p ~/kodalabs-cms/bkp

            # Debug: Output env file for verification (secrets will be masked in logs)
            echo "--- .env file created ---"
            echo "Environment file configured with $(wc -l < .env) lines"
            echo "-------------------------"

            # Check if shared monitoring is running
            if ! docker ps | grep -q "traefik"; then
              echo "   Traefik not found. Shared monitoring should be running..."
              echo "Please ensure the shared monitoring stack is deployed first."
              exit 1
            else
              echo " Shared monitoring is running, proceeding with deployment..."
            fi

            # Check if network exists
            if ! docker network ls | grep -q "monitoring_shared_monitoring_network"; then
              echo "L Shared monitoring network not found!"
              echo "Creating network..."
              docker network create monitoring_shared_monitoring_network --subnet=172.18.0.0/16
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop current containers before starting new ones
            echo "Stopping production containers..."
            docker compose -f docker-compose.prod.yml down

            # Pull latest image
            echo "Pulling latest image..."
            docker compose -f docker-compose.prod.yml pull

            # Start with new configuration
            echo "Starting production containers..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Wait for containers to be healthy
            echo "Waiting for containers to be healthy..."
            sleep 10

            # Check everything is running
            echo "Verifying all services are running..."
            docker ps | grep kodalabs-cms

            # Check container health
            echo "Checking container health..."
            docker inspect kodalabs-cms-prod --format='{{.State.Health.Status}}' || echo "Health check not yet available"

            # Test the production endpoint
            echo "Testing production endpoint:"
            curl -k -s -o /dev/null -w "%{http_code} " https://cms.kodalabs.dev/api/health || echo "Not yet available (may need SSL certificate generation)"

            # Show logs for verification
            echo "--- Recent logs ---"
            docker logs kodalabs-cms-prod --tail 20

            echo " KodaLabs CMS deployment complete!"
            echo "< Access admin panel: https://cms.kodalabs.dev/admin"
