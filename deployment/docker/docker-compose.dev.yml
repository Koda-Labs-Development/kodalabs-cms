version: '3.9'

services:
  kodalabs-cms-dev:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: base
    container_name: kodalabs-cms-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=development
      - PAYLOAD_CONFIG_PATH=src/payload.config.ts
      - DATABASE_URL=postgresql://kodalabs_cms:${POSTGRES_PASSWORD}@cms-postgres-dev:5432/kodalabs_cms
      - PAYLOAD_DROP_DATABASE=false
      - CI=true
    volumes:
      - ../../src:/app/src
      - ../../public:/app/public
      - ../../nodemon.json:/app/nodemon.json
      - ../../tsconfig.json:/app/tsconfig.json
    depends_on:
      cms-postgres-dev:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

  cms-postgres-dev:
    image: postgres:16-alpine
    container_name: kodalabs-cms-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - ../../.env
    environment:
      - POSTGRES_DB=kodalabs_cms
      - POSTGRES_USER=kodalabs_cms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - cms-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodalabs_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cms-postgres-dev-data:
    driver: local
