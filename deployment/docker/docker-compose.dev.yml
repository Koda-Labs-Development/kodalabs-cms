version: '3.9'

services:
  kodalabs-cms-dev:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: base
    container_name: kodalabs-cms-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URL=postgresql://kodalabs_cms:${POSTGRES_PASSWORD}@cms-postgres-dev:5432/kodalabs_cms
      - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3001
    volumes:
      - ../../src:/app/src
      - ../../public:/app/public
    depends_on:
      cms-postgres-dev:
        condition: service_healthy
    command: npm run dev

  cms-postgres-dev:
    image: postgres:16-alpine
    container_name: kodalabs-cms-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=kodalabs_cms
      - POSTGRES_USER=kodalabs_cms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kodalabs_cms_dev}
    volumes:
      - cms-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodalabs_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cms-postgres-dev-data:
    driver: local
