services:
  kodalabs-cms-prod:
    image: ghcr.io/${GITHUB_USER}/kodalabs-cms:prod
    container_name: kodalabs-cms-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URL=postgresql://kodalabs_cms:${POSTGRES_PASSWORD}@cms-postgres:5432/kodalabs_cms
      - PAYLOAD_PUBLIC_SERVER_URL=https://cms.kodalabs.dev
      - PAYLOAD_CONFIG_PATH=dist/payload.config.js
      - CORS_ORIGIN_PJ_CLT=${CORS_ORIGIN_PJ_CLT}
      - CORS_ORIGIN_KODALABS=${CORS_ORIGIN_KODALABS}
      - CI=true
      - PAYLOAD_DROP_DATABASE=false
    networks:
      monitoring_shared_monitoring_network:
        ipv4_address: 172.18.0.30
    depends_on:
      cms-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    labels:
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.cms.rule=Host(`cms.kodalabs.dev`)"
      - "traefik.http.routers.cms.entrypoints=websecure"
      - "traefik.http.routers.cms.tls=true"
      - "traefik.http.routers.cms.tls.certresolver=myresolver"
      - "traefik.http.services.cms.loadbalancer.server.port=3001"
      - "traefik.http.routers.cms.priority=100"
      # Security headers
      - "traefik.http.middlewares.cms-headers.headers.customResponseHeaders.X-Robots-Tag=noindex,nofollow"
      - "traefik.http.routers.cms.middlewares=cms-headers"
      # Watchtower auto-update
      - "com.centurylinklabs.watchtower.enable=true"
      # Monitoring
      - "prometheus.scrape=true"
      - "prometheus.port=3001"
      - "prometheus.path=/api/metrics"

  cms-postgres:
    image: postgres:16-alpine
    container_name: kodalabs-cms-postgres
    restart: unless-stopped
    hostname: cms-postgres
    environment:
      - POSTGRES_DB=kodalabs_cms
      - POSTGRES_USER=kodalabs_cms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    networks:
      monitoring_shared_monitoring_network:
        ipv4_address: 172.18.0.31
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodalabs_cms -d kodalabs_cms"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "prometheus.scrape=false"  # PostgreSQL metrics can be added later with postgres_exporter if needed

networks:
  monitoring_shared_monitoring_network:
    external: true

volumes:
  cms-postgres-data:
    driver: local
